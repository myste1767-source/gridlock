<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Lock - DM & Chat</title>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body style="background-color: #111; color: #fff; margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh;">

    <!-- Top Navigation Header -->
    <div style="background: #000; padding: 10px 15px; border-bottom: 2px solid red; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h2 style="color: red; margin: 0; font-size: 1.1em;">Grid Lock</h2>
            <span id="chatTitle" style="color: #0f0; font-size: 0.8em;">● LIVE GLOBAL CHAT</span>
        </div>
        <button onclick="toggleUserList()" style="background: #222; color: #fff; border: 1px solid #444; padding: 6px 10px; border-radius: 6px; font-size: 0.8em; cursor: pointer;">👥 Online Users</button>
    </div>

    <!-- Main Container -->
    <div style="display: flex; flex: 1; overflow: hidden; position: relative;">
        
        <!-- Online Users / DM Selector Drawer -->
        <div id="userDrawer" style="width: 200px; background: #181818; border-right: 1px solid #333; display: flex; flex-direction: column; position: absolute; top: 0; bottom: 0; left: -200px; transition: left 0.3s ease; z-index: 10;">
            <div style="padding: 10px; background: #222; border-bottom: 1px solid #333; font-weight: bold; font-size: 0.85em; color: #aaa;">CHATS & DIRECT MESSAGES</div>
            <div onclick="switchChat('global')" style="padding: 12px; border-bottom: 1px solid #252525; cursor: pointer; color: #00a884; font-weight: bold;">🌐 Global Chat</div>
            <div style="padding: 8px 10px; font-size: 0.75em; color: #666; font-weight: bold;">ONLINE USERS</div>
            <div id="usersList" style="flex: 1; overflow-y: auto;"></div>
        </div>

        <!-- Messages Area -->
        <div id="messages" style="flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 70px;"></div>
    </div>

    <!-- Bottom Input Bar -->
    <div style="position: fixed; bottom: 0; left: 0; right: 0; display: flex; padding: 10px; background: #000; gap: 8px; z-index: 5;">
        <input type="text" id="messageInput" placeholder="Type a message..." style="flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #333; background: #222; color: #fff; outline: none;">
        <button id="sendBtn" style="background: red; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-weight: bold;">></button>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!-- Visible User Search Bar -->
<div style="padding: 10px; background: #111; display: flex; gap: 8px;">
  <input type="text" id="user-search" placeholder="Search user..." style="flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #333; background: #222; color: #fff;">
  <button onclick="alert('Searching feature ready!')" style="padding: 8px 15px; background: red; color: white; border: none; border-radius: 5px;">Search</button>
</div>
