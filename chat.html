<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Lock - Chat & Call</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0e14; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    
    /* Top Header */
    .header { background: #151921; padding: 10px 15px; border-bottom: 2px solid red; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 100; }
    .search-box { display: flex; gap: 6px; flex: 1; max-width: 250px; }
    .search-box input { flex: 1; padding: 8px 12px; border-radius: 20px; border: 1px solid #2a2f3d; background: #0b0e14; color: #fff; font-size: 0.85em; outline: none; }
    .search-box button { padding: 6px 14px; background: red; color: white; border: none; border-radius: 20px; font-size: 0.85em; cursor: pointer; font-weight: bold; }

    /* Active Chat Header */
    .chat-info { background: #11141c; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2430; }
    .chat-info h3 { margin: 0; font-size: 0.95em; color: #e0e0e0; }

    /* Messages Area */
    #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 150px; }

    /* WhatsApp Style Bubbles */
    .message-bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 0.9em; position: relative; word-wrap: break-word; }
    .msg-sent { align-self: flex-end; background: #005c4b; color: #fff; border-bottom-right-radius: 2px; }
    .msg-received { align-self: flex-start; background: #202c33; color: #fff; border-bottom-left-radius: 2px; }
    .sender-name { font-weight: bold; color: red; margin-bottom: 3px; font-size: 0.8em; display: block; }

    /* Hidden Call Overlay & Controls */
    #call-controls { display: none; gap: 10px; margin-right: 10px; }
    #call-controls button { padding: 6px 12px; background: #222c32; color: #fff; border: 1px solid #00a884; border-radius: 15px; font-size: 0.8em; cursor: pointer; }

    /* Video Frames */
    #video-container { display: none; position: fixed; top: 110px; right: 15px; flex-direction: column; gap: 10px; z-index: 50; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; }
    #video-container video { background: #000; border-radius: 8px; border: 1px solid #333; }

    /* Bottom Input Bar */
    .input-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; padding: 10px 15px; background: #151921; gap: 10px; align-items: center; z-index: 100; }
    .input-bar input { flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid #2a2f3d; background: #0b0e14; color: #fff; outline: none; }
    .input-bar button { background: red; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 1.1em; }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="header">
    <h2 style="color: red; margin: 0; font-size: 1.1em; cursor: pointer;" onclick="selectGlobalChat()">Grid Lock</h2>
    <div class="search-box">
      <input type="text" id="user-search" placeholder="Search username...">
      <button onclick="searchUser()">Search</button>
    </div>
  </div>

  <!-- Active Chat Header -->
  <div class="chat-info">
    <h3 id="chatTitle">🌐 Global Chat</h3>
    <div id="call-controls">
      <button id="callBtn" onclick="startCall(activeRecipient)">📞 Call</button>
      <button id="screenBtn" onclick="shareScreen()">🖥️ Share</button>
    </div>
  </div>

  <!-- Messages Area -->
  <div id="messages"></div>

  <!-- Dynamic Typing Indicator Container -->
  <div id="typingIndicator" style="position: fixed; bottom: 65px; left: 15px; font-size: 0.8em; color: #00a884; font-style: italic; z-index: 99;"></div>

  <!-- Floating Video Container -->
  <div id="video-container">
    <video id="localVideo" autoplay playsinline muted style="width: 120px; height: 90px;"></video>
    <video id="remoteVideo" autoplay playsinline style="width: 200px; height: 150px;"></video>
  </div>

  <!-- Bottom Input Bar -->
  <div class="input-bar">
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button id="sendBtn" onclick="sendMessage()">></button>
  </div>

  <script src="script.js"></script>
</body>
</html>
