<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Lock - Chat & Call</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background-color: #111; color: #fff; margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #call-controls button { padding: 8px 12px; cursor: pointer; background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div style="background: #111; padding: 10px 15px; border-bottom: 2px solid red; display: flex; justify-content: space-between; align-items: center; gap: 10px;">
    <h2 style="color: red; margin: 0; font-size: 1.1em;">Grid Lock</h2>
    
    <!-- Top User Search Bar -->
    <div style="display: flex; gap: 6px; flex: 1; max-width: 250px;">
      <input type="text" id="user-search" placeholder="Search user..." style="flex: 1; padding: 6px 10px; border-radius: 15px; border: 1px solid #333; background: #222; color: #fff; font-size: 0.85em;">
      <button onclick="alert('Searching feature ready!')" style="padding: 6px 12px; background: red; color: white; border: none; border-radius: 15px; font-size: 0.85em; cursor: pointer;">Search</button>
    </div>

    <button id="toggleUserList" style="background: #222; color: #fff; border: 1px solid #444; padding: 6px 10px; border-radius: 6px; font-size: 0.8em; cursor: pointer;">
      👥 Users
    </button>
  </div>

  <!-- Main Container -->
  <div style="display: flex; flex: 1; overflow: hidden; position: relative;">
    
    <!-- Messages Area -->
    <div id="messages" style="flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 140px;"></div>

  </div>

  <!-- Call & Screen Share Controls -->
  <div id="call-controls" style="position: fixed; bottom: 60px; left: 10px; right: 10px; display: flex; gap: 10px; z-index: 10;">
    <button id="callBtn" onclick="startCall(activeRecipient)">📞 Call User</button>
    <button id="screenBtn" onclick="shareScreen()">🖥️ Share Screen</button>
  </div>

  <!-- Video Displays -->
  <div id="video-container" style="position: fixed; bottom: 105px; left: 10px; display: flex; gap: 10px; z-index: 10;">
    <video id="localVideo" autoplay playsinline muted style="width: 100px; height: 75px; background: #000; border-radius: 8px; border: 1px solid #333;"></video>
    <video id="remoteVideo" autoplay playsinline style="width: 150px; height: 75px; background: #000; border-radius: 8px; border: 1px solid #333;"></video>
  </div>

  <!-- Bottom Input Bar -->
  <div style="position: fixed; bottom: 0; left: 0; right: 0; display: flex; padding: 10px; background: #000; gap: 8px; z-index: 10;">
    <input type="text" id="messageInput" placeholder="Type a message..." style="flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #333; background: #222; color: #fff;">
    <button id="sendBtn" style="background: red; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-weight: bold;">></button>
  </div>

  <script src="script.js"></script>
</body>
</html>
