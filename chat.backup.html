<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Lock - Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .chat-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 700px;
            margin: auto;
            background: #080808;
        }

        .chat-header {
            padding: 18px;
            text-align: center;
            background: #111;
            border-bottom: 2px solid #ff2020;
            box-shadow: 0 0 15px rgba(255, 0, 0, .5);
        }

        .chat-header h1 {
            margin: 0;
            color: #ff2020;
            font-size: 28px;
            text-shadow: 0 0 15px red;
        }

        .online {
            margin-top: 6px;
            color: #39ff14;
            font-size: 13px;
        }

        .username-area {
            padding: 10px;
            background: #101010;
        }

        #username {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 20px;
            background: #1b1b1b;
            color: white;
            outline: none;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 15px;
            background: #202020;
            align-self: flex-start;
            word-wrap: break-word;
        }

        .chat-message.mine {
            background: #8b0000;
            align-self: flex-end;
        }

        .chat-message strong {
            color: #39ff14;
            font-size: 12px;
            display: block;
            margin-bottom: 3px;
        }

        .message-text {
            font-size: 15px;
        }

        .chat-input {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #111;
            border-top: 1px solid #333;
        }

        #message {
            flex: 1;
            padding: 13px 16px;
            border: none;
            border-radius: 25px;
            background: #202020;
            color: white;
            outline: none;
        }

        #message::placeholder {
            color: #888;
        }

        .send-button {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: #ff2020;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .send-button:active {
            transform: scale(.92);
        }

        .back {
            text-align: center;
            padding: 12px;
            background: #080808;
        }

        .back a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="chat-page">

    <div class="chat-header">
        <h1>Grid Lock</h1>
        <div class="online">● LIVE CHAT</div>
    </div>

    <div class="username-area">
        <input
            id="username"
            type="text"
            placeholder="Choose your username"
            maxlength="20"
        >
    </div>

    <div id="messages"></div>

    <div class="chat-input">
        <input
            id="message"
            type="text"
            placeholder="Type a message..."
            maxlength="500"
        >

        <button class="send-button" onclick="sendMessage()">➤</button>
    </div>

    <div class="back">
        <a href="index.html">← Back to Grid Lock</a>
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

function sendMessage() {
    const username = document.getElementById("username").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!username) {
        alert("Choose a username first.");
        return;
    }

    if (!message) {
        return;
    }

    socket.emit("chat message", {
        username: username,
        message: message
    });

    document.getElementById("message").value = "";
}

socket.on("chat message", function(data) {

    const messages = document.getElementById("messages");

    const messageDiv = document.createElement("div");
    messageDiv.className = "chat-message";

    const name = document.createElement("strong");
    name.textContent = data.username;

    const text = document.createElement("div");
    text.className = "message-text";
    text.textContent = data.message;

    messageDiv.appendChild(name);
    messageDiv.appendChild(text);

    messages.appendChild(messageDiv);

    messages.scrollTop = messages.scrollHeight;
});

document.getElementById("message").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
